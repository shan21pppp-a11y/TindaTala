function pcalc(){const w=CS.includes(f('pk')),z={c:w?n(f('pa')):0,t:w?0:n(f('pt')),d:w?0:n(f('pd'))},g=x=>x=='b'?1:(z[x]>0?z[x]:1),cost=n(f('pci'))/g(f('pcu')),v=n(f('pai'))/g(f('pau')),price=cost+v,q=Math.round(n(f('pqi'))*g(f('pqu'))*1e6)/1e6,bad=[f('pcu'),f('pau'),f('pqu')].filter(x=>x!='b'&&!(z[x]>0)),miss=bad.includes('t')?'tie':bad.includes('d')?'dozen':bad.includes('c')?'case':'';
